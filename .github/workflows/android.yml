
name: Build HALLWAYS Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.2

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Godot Android templates
        shell: bash
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.2.2.stable"

          curl -L --fail -o /tmp/templates.tpz \
            https://github.com/godotengine/godot-builds/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz

          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates

          cp -a /tmp/godot-templates/templates/. \
            "$HOME/.local/share/godot/export_templates/4.2.2.stable/"

      - name: Configure Android
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<'EOF'
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Prepare project
        shell: bash
        run: |
          mkdir -p game
          unzip -q HALLWAYS_0.1_CONTROLES_ANDROID.zip -d game

          PROJECT_FILE="$(find game -name project.godot -print -quit)"

          if [ -z "$PROJECT_FILE" ]; then
            echo "No se encontró project.godot"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          mkdir -p "$PROJECT_DIR/build"

          cat > "$PROJECT_DIR/export_presets.cfg" <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/HALLWAYS.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/export_format=0
          gradle_build/min_sdk=23
          gradle_build/target_sdk=34
          package/unique_name="org.hallways.game"
          package/name="HALLWAYS"
          version/code=1
          version/name="0.1"
          screen/immersive_mode=true
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          EOF

      - name: Import project
        run: godot --headless --editor --path "$PROJECT_DIR" --import

      - name: Export Android APK
        run: godot --headless --path "$PROJECT_DIR" --export-debug "Android" "$PROJECT_DIR/build/HALLWAYS.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HALLWAYS-Android-debug
          path: ${{ env.PROJECT_DIR }}/build/HALLWAYS.apk
          if-no-files-found: error
          
